      enabled: true

    - id: "surface-treatment"
      name: "金属卷材表面处理"
      url: "https://news.google.com/rss/search?q=%E9%87%91%E5%B1%9E%E5%8D%B7%E6%9D%90%20OR%20%E9%92%A2%E5%8D%B7%20OR%20%E9%93%9D%E5%8D%B7%20OR%20%E8%A1%A8%E9%9D%A2%E5%A4%84%E7%90%86%20OR%20%E9%A2%84%E5%A4%84%E7%90%86%20OR%20%E9%92%9D%E5%8C%96%20OR%20%E6%97%A0%E9%93%AC%20OR%20BONDERITE%20OR%20Chemetall&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      enabled: true

    - id: "thermal-adhesive"
      name: "导热胶与热界面材料"
      url: "https://news.google.com/rss/search?q=%E5%AF%BC%E7%83%AD%E8%83%B6%20OR%20%E5%AF%BC%E7%83%AD%E7%A1%85%E8%83%B6%20OR%20%E7%83%AD%E7%95%8C%E9%9D%A2%E6%9D%90%E6%96%99%20OR%20thermal%20conductive%20adhesive%20OR%20thermal%20interface%20material%20OR%20TIM&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      enabled: true

    - id: "adhesives-sealants"
      name: "胶粘剂与密封剂"
      url: "https://news.google.com/rss/search?q=%E8%83%B6%E7%B2%98%E5%89%82%20OR%20%E8%83%B6%E9%BB%8F%E5%89%82%20OR%20%E5%AF%86%E5%B0%81%E8%83%B6%20OR%20adhesive%20OR%20sealant%20OR%20Henkel%20OR%20Sika%20OR%20Bostik%20OR%20Arkema%20OR%20H.B.%20Fuller&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      enabled: true

report:
  mode: "daily"
  display_mode: "keyword"
  sort_by_position_first: true
  rank_threshold: 5
  max_news_per_keyword: 10

filter:
  method: "keyword"
  priority_sort_enabled: true

ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

display:
  region_order:
    - rss
    - ai_analysis

  regions:
    hotlist: false
    new_items: false
    rss: true
    standalone: false
    ai_analysis: false

  standalone:
    platforms: []
    rss_feeds: []
    max_items: 20

notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

ai:
  model: "deepseek/deepseek-v4-flash"
  api_key: ""
  api_base: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []

ai_analysis:
  enabled: false
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 80
  include_rss: true
  include_standalone: false
  include_rank_timeline: false

ai_translation:
  enabled: false
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: false
    standalone: false

advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
